name: Sync README.md

on:
  push:
    branches:
      - '**'
    paths:
      - README.md
      - .github/workflows/sync-readme.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Sync README.md to GUGUbot
      run: |
        cp README.md GUGUbot/README.md
        git config --global user.name "GUGUbot"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add GUGUbot/README.md
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Sync README.md from root to GUGUbot"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF"; then
              exit 0
            fi
          done
          exit 1
        fi
