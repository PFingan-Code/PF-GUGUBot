name: Sync config_default.yml

on:
  push:
    branches:
      - '**'
    paths:
      - GUGUbot/gugubot/config/defaults/default_config.yml
      - .github/workflows/sync-default-config.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-config:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Sync config_default.yml
      run: |
        cp GUGUbot/gugubot/config/defaults/default_config.yml default_config.yml
        git config --global user.name "GUGUbot"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add default_config.yml
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Sync config_default.yml from GUGUbot/gugubot/config/defaults to root"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF"; then
              exit 0
            fi
          done
          exit 1
        fi
